services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digitize}
      POSTGRES_USER: ${POSTGRES_USER:-digitize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      target: admin-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-digitize}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-digitize}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  admin-api:
    build:
      context: .
      target: admin-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-digitize}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-digitize}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/business/auth/google/callback}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  customer-api:
    build:
      context: .
      target: customer-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CUSTOMER_JWT_SECRET: ${CUSTOMER_JWT_SECRET:-${JWT_SECRET:?Set JWT_SECRET in .env}}
      PUBLIC_STORE_ID: ${PUBLIC_STORE_ID:-}
      PUBLIC_STORE_SLUG: ${PUBLIC_STORE_SLUG:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-digitize}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-digitize}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  admin-ui:
    build:
      context: .
      target: admin-ui
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    depends_on:
      - admin-api
  ui:
    build:
      context: .
      target: ui
      args:
        NEXT_PUBLIC_CUSTOMER_API_URL: ${NEXT_PUBLIC_CUSTOMER_API_URL:-}
    restart: unless-stopped
    depends_on:
      - customer-api
  preview:
    build:
      context: .
      target: preview
    restart: unless-stopped
    depends_on:
      - admin-api

  haproxy:
    image: haproxy:3.1-alpine
    restart: unless-stopped
    depends_on:
      - admin-api
      - customer-api
      - admin-ui
      - ui
      - preview
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

volumes:
  postgres_data:
