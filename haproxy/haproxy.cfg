global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 60s
  timeout server 60s

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout retry 1s
  hold valid 10s

frontend public
  bind :80
  acl admin_api_request path_beg /api/business
  acl customer_api_request path_beg /api/public
  acl admin_ui_request path_beg /business
  acl admin_ui_asset path_beg /business/_next
  acl preview_request path_beg /preview
  use_backend admin_api if admin_api_request
  use_backend customer_api if customer_api_request
  use_backend admin-ui if admin_ui_asset
  use_backend preview if preview_request
  use_backend admin-ui if admin_ui_request
  default_backend ui

backend admin_api
  server admin-api admin-api:3000 check resolvers docker init-addr libc,none

backend customer_api
  server customer-api customer-api:3001 check resolvers docker init-addr libc,none

backend admin-ui
  http-request set-path %[path,regsub(^/business,)] if { path_beg /business/_next/ }
  http-response set-header Cache-Control no-store
  server admin-ui admin-ui:3000 check resolvers docker init-addr libc,none

backend ui
  server ui ui:3000 check resolvers docker init-addr libc,none

backend preview
  # The preview Next.js application is mounted at its own root. Strip the
  # public /preview prefix for both the page and its generated assets.
  http-request replace-path ^/preview/?(.*) /\1
  server preview preview:3000 check resolvers docker init-addr libc,none
