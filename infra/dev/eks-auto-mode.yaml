apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: digitize-dev
  region: ap-south-1

autoModeConfig:
  enabled: true
  nodePools:
    - general-purpose
    - system

cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator
      - controllerManager
      - scheduler

