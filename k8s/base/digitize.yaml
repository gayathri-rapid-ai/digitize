apiVersion: v1
kind: Namespace
metadata:
  name: digitize
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: digitize-config
  namespace: digitize
data:
  NODE_ENV: production
  ADMIN_API_PORT: "3000"
  CUSTOMER_API_PORT: "3001"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
  namespace: digitize
data:
  haproxy.cfg: |
    global
      log stdout format raw local0
    defaults
      mode http
      log global
      option httplog
      timeout connect 5s
      timeout client 60s
      timeout server 60s
    frontend public
      bind :8080
      acl admin_api_request path_beg /api/business
      acl customer_api_request path_beg /api/public
      acl admin_ui_request path_beg /business
      acl admin_ui_asset path_beg /business/_next
      acl preview_request path_beg /preview
      use_backend admin_api if admin_api_request
      use_backend customer_api if customer_api_request
      use_backend admin_ui if admin_ui_asset
      use_backend preview if preview_request
      use_backend admin_ui if admin_ui_request
      default_backend ui
    backend admin_api
      server admin-api admin-api:3000 check
    backend customer_api
      server customer-api customer-api:3001 check
    backend admin_ui
      http-request set-path %[path,regsub(^/business,)] if { path_beg /business/_next/ }
      http-response set-header Cache-Control no-store
      server admin-ui admin-ui:3000 check
    backend ui
      server ui ui:3000 check
    backend preview
      http-request replace-path ^/preview/?(.*) /\1
      server preview preview:3000 check
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: digitize
spec:
  replicas: 2
  selector: { matchLabels: { app: admin-api } }
  template:
    metadata: { labels: { app: admin-api } }
    spec:
      containers:
        - name: admin-api
          image: digitize-admin-api:IMAGE_TAG_PLACEHOLDER
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: PORT, valueFrom: { configMapKeyRef: { name: digitize-config, key: ADMIN_API_PORT } } }
          envFrom:
            - configMapRef: { name: digitize-config }
            - secretRef: { name: digitize-secrets }
          readinessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: admin-api, namespace: digitize }
spec:
  selector: { app: admin-api }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: customer-api, namespace: digitize }
spec:
  replicas: 2
  selector: { matchLabels: { app: customer-api } }
  template:
    metadata: { labels: { app: customer-api } }
    spec:
      containers:
        - name: customer-api
          image: digitize-customer-api:IMAGE_TAG_PLACEHOLDER
          ports: [{ name: http, containerPort: 3001 }]
          env:
            - { name: PORT, valueFrom: { configMapKeyRef: { name: digitize-config, key: CUSTOMER_API_PORT } } }
          envFrom:
            - configMapRef: { name: digitize-config }
            - secretRef: { name: digitize-secrets }
          readinessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: customer-api, namespace: digitize }
spec:
  selector: { app: customer-api }
  ports: [{ name: http, port: 3001, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: admin-ui, namespace: digitize }
spec:
  replicas: 2
  selector: { matchLabels: { app: admin-ui } }
  template:
    metadata: { labels: { app: admin-ui } }
    spec:
      containers:
        - name: admin-ui
          image: digitize-admin-ui:IMAGE_TAG_PLACEHOLDER
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: admin-ui, namespace: digitize }
spec:
  selector: { app: admin-ui }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ui, namespace: digitize }
spec:
  replicas: 2
  selector: { matchLabels: { app: ui } }
  template:
    metadata: { labels: { app: ui } }
    spec:
      containers:
        - name: ui
          image: digitize-ui:IMAGE_TAG_PLACEHOLDER
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: ui, namespace: digitize }
spec:
  selector: { app: ui }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: preview, namespace: digitize }
spec:
  replicas: 2
  selector: { matchLabels: { app: preview } }
  template:
    metadata: { labels: { app: preview } }
    spec:
      containers:
        - name: preview
          image: digitize-preview:IMAGE_TAG_PLACEHOLDER
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: preview, namespace: digitize }
spec:
  selector: { app: preview }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: haproxy, namespace: digitize }
spec:
  replicas: 2
  selector: { matchLabels: { app: haproxy } }
  template:
    metadata: { labels: { app: haproxy } }
    spec:
      containers:
        - name: haproxy
          image: haproxy:3.1-alpine
          ports: [{ name: http, containerPort: 8080 }]
          volumeMounts: [{ name: config, mountPath: /usr/local/etc/haproxy, readOnly: true }]
          readinessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      volumes:
        - name: config
          configMap: { name: haproxy-config }
---
apiVersion: v1
kind: Service
metadata: { name: haproxy, namespace: digitize }
spec:
  selector: { app: haproxy }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digitize
  namespace: digitize
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: haproxy, port: { name: http } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: digitize-apps, namespace: digitize }
spec:
  maxUnavailable: 1
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [admin-api, customer-api, admin-ui, ui, preview, haproxy]
